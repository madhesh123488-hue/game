<!DOCTYPE html>
<html>
<head>
    <title>Number Guess Game</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f0f8ff; }
        h1 { color: #2c3e50; }
        .box { margin-top: 40px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #27ae60; color: white; border: none; cursor: pointer; }
        button:hover { background: #1e8449; }
        .msg { margin-top: 20px; font-size: 18px; color: #e74c3c; }
    </style>
</head>
<body>
    <h1>🎮 Number Guess Challenge (1–50)</h1>
    <div class="box">
        <form method="POST">
            <input type="number" name="guess" placeholder="1 - 50" required>
            <button type="submit">Guess</button>
        </form>
        <div class="msg">{{ message }}</div>
        <a href="/restart"><button>🔄 Restart Game</button></a>
    </div>
</body>
</html>
